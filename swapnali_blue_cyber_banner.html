<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Swapnali Chavan – QA Engineer Banner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #010b17; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Courier New', monospace; }

  @keyframes pulse-ring {
    0%,100% { box-shadow: 0 0 16px #0ea5e966, 0 0 40px #0ea5e922; }
    50%      { box-shadow: 0 0 32px #0ea5e9aa, 0 0 70px #0ea5e944; }
  }
  @keyframes scan-line {
    0%   { transform: translateY(-100%); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translateY(900%); opacity: 0; }
  }
  @keyframes glitch1 {
    0%,100% { clip-path: inset(0 0 98% 0); transform: translateX(0); }
    20% { clip-path: inset(10% 0 60% 0); transform: translateX(-4px); }
    40% { clip-path: inset(50% 0 30% 0); transform: translateX(4px); }
    60% { clip-path: inset(80% 0 5%  0); transform: translateX(-2px); }
    80% { clip-path: inset(30% 0 50% 0); transform: translateX(2px); }
  }
  @keyframes glitch2 {
    0%,100% { clip-path: inset(0 0 98% 0); transform: translateX(0); }
    25% { clip-path: inset(20% 0 40% 0); transform: translateX(5px); }
    50% { clip-path: inset(60% 0 20% 0); transform: translateX(-3px); }
    75% { clip-path: inset(40% 0 45% 0); transform: translateX(3px); }
  }
  @keyframes flicker {
    0%,100% { opacity: 1; }
    92% { opacity: 1; }
    93% { opacity: 0.4; }
    94% { opacity: 1; }
    96% { opacity: 0.6; }
    97% { opacity: 1; }
  }
  @keyframes float-dot {
    0%   { transform: translateY(0px);  opacity: 0.6; }
    50%  { transform: translateY(-8px); opacity: 1; }
    100% { transform: translateY(0px);  opacity: 0.6; }
  }
  @keyframes glow-bar {
    0%,100% { opacity: 0.7; }
    50%      { opacity: 1; transform: scaleX(1.04); }
  }
  @keyframes tag-in {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes counter-up {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes circuit-draw {
    from { stroke-dashoffset: 300; }
    to   { stroke-dashoffset: 0; }
  }
  @keyframes badge-pulse {
    0%,100% { background: #16a34a22; border-color: #16a34a66; }
    50%      { background: #16a34a44; border-color: #16a34a; }
  }
  @keyframes orbit-spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  @keyframes data-stream {
    0%   { opacity: 0; transform: translateY(-20px); }
    20%  { opacity: 0.7; }
    80%  { opacity: 0.7; }
    100% { opacity: 0; transform: translateY(30px); }
  }
  @keyframes corner-blink {
    0%,90%,100% { opacity: 1; }
    95%          { opacity: 0.2; }
  }

  .banner {
    width: 860px;
    background: #020c1b;
    border-radius: 14px;
    overflow: hidden;
    position: relative;
    height: 240px;
    display: flex;
    align-items: center;
    border: 1px solid #0ea5e933;
  }

  /* Grid */
  .grid-bg {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(#0ea5e911 1px, transparent 1px),
      linear-gradient(90deg, #0ea5e911 1px, transparent 1px);
    background-size: 32px 32px;
  }

  /* Vignette */
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 50%, transparent 40%, #020c1bcc 100%);
  }

  /* Scan */
  .scan {
    position: absolute; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, #38bdf855, transparent);
    animation: scan-line 3s linear infinite;
    z-index: 5;
  }

  /* Corner brackets */
  .c-tl { position:absolute; top:10px; left:10px;  width:22px; height:22px; border-top:2px solid #38bdf8; border-left:2px solid #38bdf8;  animation:corner-blink 3s ease-in-out infinite; }
  .c-tr { position:absolute; top:10px; right:10px; width:22px; height:22px; border-top:2px solid #38bdf8; border-right:2px solid #38bdf8; animation:corner-blink 3s ease-in-out infinite 0.5s; }
  .c-bl { position:absolute; bottom:10px; left:10px;  width:22px; height:22px; border-bottom:2px solid #38bdf8; border-left:2px solid #38bdf8;  animation:corner-blink 3s ease-in-out infinite 1s; }
  .c-br { position:absolute; bottom:10px; right:10px; width:22px; height:22px; border-bottom:2px solid #38bdf8; border-right:2px solid #38bdf8; animation:corner-blink 3s ease-in-out infinite 1.5s; }

  /* HUD labels */
  .hud-l { position:absolute; top:14px; left:40px;  font-size:9px; letter-spacing:2px; color:#38bdf866; animation:flicker 5s ease-in-out infinite; }
  .hud-r { position:absolute; top:14px; right:40px; font-size:9px; letter-spacing:2px; color:#38bdf866; animation:flicker 5s ease-in-out infinite 1s; }

  /* Glow bar */
  .glow-bar {
    position:absolute; bottom:50px; left:0; right:0; height:2px;
    background: linear-gradient(90deg, transparent, #7dd3fc, #38bdf8, #7dd3fc, transparent);
    animation: glow-bar 2s ease-in-out infinite;
  }

  /* Footer strip */
  .footer-strip {
    position:absolute; bottom:0; left:0; right:0; height:50px;
    border-top: 1px solid #0ea5e933;
    background: linear-gradient(180deg, transparent, #020c1b88);
    display:flex; align-items:center; padding:0 44px; gap:18px;
  }
  .footer-strip span {
    font-size:9px; letter-spacing:2px;
  }

  /* Content */
  .content {
    position:relative; z-index:10;
    display:flex; align-items:center;
    padding: 0 44px; gap: 30px; width:100%;
    margin-top: -12px;
  }

  /* Avatar */
  .avatar-wrap {
    width:130px; height:130px; border-radius:50%;
    border:2px solid #0ea5e9; padding:3px;
    flex-shrink:0;
    animation: pulse-ring 2.5s ease-in-out infinite;
    background:#020c1b; position:relative;
  }
  .avatar-wrap .ring1 {
    position:absolute; inset:-8px; border-radius:50%;
    border:1px solid #38bdf822;
    pointer-events:none;
  }
  .avatar-wrap .ring2 {
    position:absolute; inset:-15px; border-radius:50%;
    border:1px dashed #38bdf811;
    animation: orbit-spin 12s linear infinite;
    pointer-events:none;
  }
  .avatar-wrap img {
    width:100%; height:100%; border-radius:50%;
    object-fit:cover; object-position:center top; display:block;
    filter: saturate(1.1) brightness(1.05);
  }
  .orbit-dot {
    position:absolute; top:-5px; left:50%;
    width:9px; height:9px; margin-left:-4.5px;
    background:#38bdf8; border-radius:50%;
    animation: float-dot 2s ease-in-out infinite;
    box-shadow: 0 0 10px #38bdf8;
  }

  /* Divider */
  .divider {
    width:1px; height:90px; flex-shrink:0;
    background: linear-gradient(180deg, transparent, #0ea5e999, transparent);
  }

  /* Text block */
  .text-block { flex:1; }

  .role-label {
    font-size:10px; letter-spacing:3px; color:#7dd3fc;
    text-transform:uppercase; margin-bottom:8px;
    animation: flicker 4s ease-in-out infinite;
  }
  .role-label span { color:#38bdf8; }

  .name {
    position:relative; font-size:30px; font-weight:800;
    color:#e0f2fe; letter-spacing:2px; text-transform:uppercase;
    line-height:1.15; margin-bottom:12px;
    text-shadow: 0 0 30px #0ea5e955;
  }
  .name .g1 {
    position:absolute; top:0; left:0; color:#38bdf8;
    animation: glitch1 5s ease-in-out infinite 2s;
  }
  .name .g2 {
    position:absolute; top:0; left:0; color:#f0abfc;
    animation: glitch2 5s ease-in-out infinite 2.1s;
  }

  /* Tags */
  .tags { display:flex; flex-wrap:wrap; gap:6px; }
  .tag {
    font-size:10px; padding:3px 10px; border-radius:3px;
    border:1px solid #0ea5e955; color:#7dd3fc; background:#0c1f3a;
    opacity:0;
  }
  .tag-open {
    border-color:#16a34a88 !important; color:#4ade80 !important;
    background:#052e16 !important;
    animation: badge-pulse 2s ease-in-out infinite 2s !important;
  }

  /* Social links */
  .links {
    position:absolute; right:44px; top:50%; transform:translateY(-50%);
    display:flex; flex-direction:column; gap:8px; z-index:10;
  }
  .links a {
    display:flex; align-items:center; gap:6px;
    font-size:9px; letter-spacing:1.5px; color:#7dd3fc;
    text-decoration:none; padding:4px 8px;
    border:1px solid #0ea5e933; border-radius:3px;
    background:#0c1f3a88;
    transition: border-color 0.2s, color 0.2s;
    opacity:0; animation: tag-in 0.4s ease forwards;
  }
  .links a:hover { border-color:#38bdf8; color:#e0f2fe; }
  .links a svg { width:11px; height:11px; fill:currentColor; flex-shrink:0; }
</style>
